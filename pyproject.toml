[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-audit"
version = "1.0.0"
description = "NAT behaviour and ISP peering auditor for consumer internet connections"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Shad Ebny Wahid" }]
keywords = ["nat", "stun", "cgnat", "bdix", "networking", "rfc5389", "rfc5780", "p2p"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/saadw50/nat-audit"
Issues = "https://github.com/saadw50/nat-audit/issues"

[project.scripts]
nat-audit = "nat_audit.cli:main"

[tool.setuptools.packages.find]
include = ["nat_audit*"]
